spring.application.name=vynk
# Lee el archivo .env de la carpeta desde donde se ejecuta (opcional).
spring.config.import=optional:file:.env[.properties]

# Si falla la BD, el error aparece en ~5 s en vez de dejar la app cargando 30 s.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vynk?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}

# Valores publicos de Google: tienen default para que el proyecto arranque tras un clone.
vynk.auth.issuer=${OAUTH_ISSUER:https://accounts.google.com}
vynk.auth.jwks-uri=${OAUTH_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
vynk.auth.client-id=${OAUTH_CLIENT_ID:451390492028-nrsbd0i4nbftbfjoe2htguebvk0mdi1r.apps.googleusercontent.com}
vynk.auth.dominio=@tecsup.edu.pe

# Secreto: NO tiene default. Debe venir de .env o de una variable de entorno (min. 32 caracteres).
vynk.jwt.secret=${JWT_SECRET}
vynk.jwt.horas=8
vynk.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.port=8081
